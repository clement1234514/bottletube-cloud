<VirtualHost *:80>
    ServerName bottletube

    WSGIDaemonProcess bottletube user=www-data group=www-data threads=5
    WSGIScriptAlias / /var/www/bottletube/wsgi.py

    <Directory /var/www/bottletube>
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/bottletube-error.log
    CustomLog ${APACHE_LOG_DIR}/bottletube-access.log combined
</VirtualHost>
